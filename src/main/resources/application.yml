server:
  port: 8080
spring:
  application:
    name: springAiDemo
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-turbo
          max-tokens: 1000
        enabled: false
      embedding:
        options:
          model: text-embedding-v3
    vectorstore:
      milvus:
        client:
          host: ${HOST}
          port: ${MILVUS_PORT}
        database-name: springAiDemo
    memory:
      redis:
        host: ${HOST}
        port: ${REDIS_PORT}
        password: ${REDIS_PASSWORD}
logging:
  level:
    org.springframework.ai.chat.client: debug
    com.touhouqing.springaidemo: debug
