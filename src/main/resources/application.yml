server:
  port: 8080
spring:
  application:
    name: springAiDemo
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/spring_ai_demo?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-turbo
          max-tokens: 300
      embedding:
        options:
          model: text-embedding-v3
    vectorstore:
      milvus:
        client:
          host: ${HOST}
          port: ${MILVUS_PORT}
        database-name: springAiDemo
        collectionName: springAiDemo
        indexType: IVF_FLAT
        embeddingDimension: 1024
        initialize-schema: true
    memory:
      redis:
        host: ${HOST}
        port: ${REDIS_PORT}
        password: ${REDIS_PASSWORD}
        timeout: 2000
      mysql:
        jdbc-url: ${DB_URL:jdbc:mysql://localhost:3306/spring_ai_demo?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD}
        enabled: true
logging:
  level:
    org.springframework.ai.chat.client: debug
    com.touhouqing.springaidemo: debug
